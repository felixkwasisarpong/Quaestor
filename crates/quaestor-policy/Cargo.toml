[package]
name = "quaestor-policy"
description = "Deterministic spend policy evaluation. No clock, no network, no LLM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["crypto"]
# The evaluator itself uses no cryptography: it takes an already-verified
# `Scope` as an argument. This only forwards the feature so a caller that
# wants the pure half can have it.
crypto = ["quaestor-verify/crypto"]

[dependencies]
quaestor-core = { path = "../quaestor-core" }
quaestor-verify = { path = "../quaestor-verify", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
sha3 = { version = "0.10", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = { workspace = true }
