# A worked deployment. Every value here is deliberate; the comments say why.

listen = "127.0.0.1:8402"
policy = "examples/policy.toml"

# Where decision receipts are appended, as JSON Lines. Required, with no
# default: a gateway that signs receipts and writes them nowhere leaves the
# only copy of the evidence with the party it is auditing.
receipt_log = "receipts.jsonl"

# How long a remembered `402` stays valid. Should comfortably exceed the time
# an agent takes to sign a payment and come back, and should not greatly
# exceed the origin's own maxTimeoutSeconds: a challenge we still honour
# after the origin has forgotten it produces a payment the origin rejects.
challenge_ttl_seconds = 120

# Budgets in memory are forgotten on restart, which makes a crash loop an
# unlimited allowance. Set QUAESTOR_PG instead of this for anything real.
allow_volatile_ledger = true

# Tokens this deployment will accept payments in. Nothing is auto-discovered:
# decimals decide whether a number means one dollar or one millionth of one,
# and an unknown asset is refused rather than guessed at.
[[assets]]
network = "eip155:8453"                                  # CAIP-2, Base
address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"   # USDC
currency = "USDC"
eip712_name = "USD Coin"      # from our config, never from the counterparty
eip712_version = "2"
chain_id = 8453

[[callers]]
# The token itself lives in the environment, not in this file. Files get
# committed; a table of bearer tokens in a repository is a bad afternoon.
token_env = "QUAESTOR_TOKEN_SHOPPER"
principal = "felix"
agent = "shopper"

# Ceiling on a single payment. No default on purpose: a limit this file
# forgot to write down must not become an unlimited one.
max_amount = "5.000000 USDC"

rails = ["x402"]
valid_for_seconds = 86400

# Recipients this credential may pay. Leave the key out entirely for "no
# restriction". An empty list is not the same thing — it permits nothing.
# payees = ["0x209693bc6afc0c5328ba36faf03c514ef312287c"]

# Ed25519 keys trusted to originate a delegation chain for this caller.
# Absent means this caller may present no chain at all, and a chain it does
# present may only narrow what is configured above, never widen it.
# root_keys = ["..."]
