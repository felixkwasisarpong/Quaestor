name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The generated page is committed, because it is the file people open.
      # This is the guard against it drifting from the template it came from.
      - name: Playground is not stale
        run: python3 scripts/check_playground.py

  # Non-blocking, and the point of it: the pinned job above is what gates a
  # merge, and this one tells us a future compiler will complain *before*
  # the upgrade commit lands. The alternative is what happened in September:
  # nineteen days of red CI that local checks could not reproduce.
  next-stable:
    name: latest stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest stable, whatever it is
        run: |
          rm -f rust-toolchain.toml
          rustup update stable && rustup default stable
          rustup component add clippy
          cargo --version && cargo clippy --version
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: -D warnings

  playground:
    name: wasm builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build
        run: cargo build -p quaestor-playground --target wasm32-unknown-unknown --profile wasm-release
      # Building is not evidence it works: the crate's own tests run on
      # x86_64, and this is the only place the actual artifact is executed.
      - name: The module answers
        run: node scripts/smoke-playground.mjs target/wasm32-unknown-unknown/wasm-release/quaestor_playground.wasm
